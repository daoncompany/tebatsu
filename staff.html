<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>스텝 페이지 | 테바츠</title>
<meta name="theme-color" content="#1f1f1f">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261104b">
<link rel="stylesheet" href="css/staff.css?v=20261104b">
</head>
<body class="staff">

<header class="staff__bar">
  <a href="index.html" class="logo" aria-label="테바츠 사이트로"><img src="images/테바츠그림로고.svg" alt="" width="81" height="81"><img src="images/테바츠글씨로고.svg" alt="테바츠" width="170" height="87"></a>
  <span class="staff__label">스텝 페이지</span>
  <button type="button" class="staff__logout" hidden>로그아웃</button>
</header>

<main class="staff__main">

  <!-- 로그인 -->
  <form class="card login" id="loginForm" novalidate>
    <h1>스텝 로그인</h1>
    <p class="card__sub">게시판 관리를 위해 비밀번호를 입력하세요.</p>
    <label class="sf"><span>비밀번호</span><input type="password" name="password" required autocomplete="current-password"></label>
    <p class="msg" role="status" aria-live="polite"></p>
    <button type="submit" class="sbtn">들어가기</button>
  </form>

  <div class="panel" hidden>
    <!-- 글쓰기 -->
    <form class="card" id="writeForm" novalidate>
      <h2>글쓰기</h2>
      <div class="sf-row">
        <label class="sf sf--tag"><span>구분</span>
          <select name="cat"><option>공지</option><option>신규소식</option></select>
        </label>
        <label class="sf sf--grow"><span>제목 <i>*</i></span><input name="title" required maxlength="120"></label>
      </div>
      <label class="sf"><span>본문 <i>*</i></span><textarea name="body" required rows="10"></textarea></label>
      <p class="msg" role="status" aria-live="polite"></p>
      <button type="submit" class="sbtn">등록하기</button>
    </form>

    <!-- 목록 -->
    <section class="card">
      <div class="card__head">
        <h2>게시물 목록</h2>
        <button type="button" class="sbtn sbtn--line" id="reload">새로고침</button>
      </div>
      <p class="msg" id="listMsg" role="status" aria-live="polite"></p>
      <ul class="slist" id="postList"></ul>
    </section>
  </div>
</main>

<script src="js/api.js?v=20261104b"></script>
<script src="js/staff.js?v=20261104b"></script>
</body>
</html>
